{% comment %}Appearance: theme and density of the interface.{% endcomment %}
<form method="post" action="{% url 'settings_tab' slug='appearance' %}">
    {% csrf_token %}

    <div class="card">
        <div class="card-body">
            <h6 class="fw-semibold mb-1">
                <i class="ti ti-palette me-1 text-primary"></i>How the interface looks
            </h6>
            <p class="text-muted small mb-0">
                These choices belong to your account only. Other users of this business keep their own.
            </p>
        </div>
    </div>

    <div class="card mt-3">
        <div class="card-body">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="id_theme">Theme</label>
                    <select name="theme" id="id_theme" class="form-select">
                        {% for value, label in preference_form.fields.theme.choices %}
                        <option value="{{ value }}" {% if preference.theme == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="id_density">Density</label>
                    <select name="density" id="id_density" class="form-select">
                        {% for value, label in preference_form.fields.density.choices %}
                        <option value="{{ value }}" {% if preference.density == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12">
                    <div class="app-switch-row">
                        <div>
                            <div class="app-switch-label">Collapse the sidebar</div>
                            <div class="app-switch-text">Show the menu as icons only. You can still open it on hover.</div>
                        </div>
                        <div class="form-check form-switch">
                            <input type="checkbox" class="form-check-input" name="sidebar_collapsed"
                                   id="id_sidebar_collapsed" {% if preference.sidebar_collapsed %}checked{% endif %}>
                        </div>
                    </div>
                </div>
            </div>

            <div class="app-form-actions">
                <a href="{% url 'settings_tab' slug='appearance' %}" class="btn btn-outline-secondary">Reset</a>
                <button type="submit" class="btn btn-primary">
                    <i class="ti ti-device-floppy me-1"></i>Save appearance
                </button>
            </div>
        </div>
    </div>
</form>
