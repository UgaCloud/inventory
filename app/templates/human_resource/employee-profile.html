{% extends 'basic/base.html' %}
{% load static %}
{% block content %}
<div class="page-wrapper p-0 m-0">
	<div class="content">
		<div class="page-header">
			<div class="page-title">
				<h4>Profile</h4>
				<h6>User Profile</h6>
			</div>
		</div>
		<!-- /product list -->
		<div class="card">
			<div class="card-header">
				<h4>Profile</h4>
			</div>
			<div class="card-body profile-body">
				<h5 class="mb-2"><i class="ti ti-user text-primary me-1"></i>Basic Information</h5>
				<div class="profile-pic-upload image-field">
					<div class="profile-pic p-2">
						<img src="{% static './assets/img/users/user-49.png' %}" class="object-fit-cover h-100 rounded-1" alt="user">
						<button type="button" class="close rounded-1">
							<span aria-hidden="true">&times;</span>
						</button>
					</div>
					
				</div>
				<div class="row">
					<div class="col-lg-6 col-sm-12">
						First Name: 
					</div>
					<div class="col-lg-6 col-sm-12">
						<div class="mb-3">
							Last Name: 
						</div>
					</div>
					<div class="col-lg-6 col-sm-12">
						<div class="mb-3">
							Email: 
						</div>
					</div>
					<div class="col-lg-6 col-sm-12">
						<div class="mb-3">
							Phone Number:
						</div>
					</div>
					<div class="col-lg-6 col-sm-12">
						<div class="mb-3">
							User Name:
						</div>
					</div>
					<div class="col-lg-6 col-sm-12">
						<div class="mb-3">
							Branch:
						</div>
					</div>
					<div class="col-lg-6 col-sm-12">
						<div class="mb-3">
							Department:
						</div>
					</div>
					<div class="col-lg-6 col-sm-12">
						<div class="mb-3">
							Address:
						</div>
					</div>
					
				</div>
			</div>
		</div>
		<!-- /product list -->
	</div>
	{% endblock %}
	<div class="footer d-sm-flex align-items-center justify-content-between border-top bg-white p-3">
		<p class="mb-0 text-gray-9">2014 - 2025 &copy; DreamsPOS. All Right Reserved</p>
		<p>Designed &amp; Developed by <a href="javascript:void(0);" class="text-primary">Dreams</a></p>
	</div>
</div>
</div>


<!-- /Main Wrapper -->



<!-- jQuery -->
<script src="assets/js/jquery-3.7.1.min.js"></script>

<!-- Feather Icon JS -->
<script src="assets/js/feather.min.js"></script>

<!-- Slimscroll JS -->
<script src="assets/js/jquery.slimscroll.min.js"></script>

<!-- Datatable JS -->
<script src="assets/js/jquery.dataTables.min.js"></script>
<script src="assets/js/dataTables.bootstrap5.min.js"></script>

<!-- Bootstrap Core JS -->
<script src="assets/js/bootstrap.bundle.min.js"></script>

<!-- Select2 JS -->
<script src="assets/plugins/select2/js/select2.min.js"></script>

<!-- Color Picker JS -->
<script src="assets/plugins/@simonwep/pickr/pickr.es5.min.js"></script>

<!-- Custom JS -->
<script src="assets/js/theme-colorpicker.js"></script>
<script src="assets/js/script.js"></script>

</body>


</html>
