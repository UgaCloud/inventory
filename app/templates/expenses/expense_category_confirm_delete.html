{% extends 'basic/base.html' %}
{% load static %}

{% block title %}Delete Expense Category | Inventory Management{% endblock %}

{% block content %}
<div class="content">
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body">
            <h5 class="mb-2">Delete category</h5>
            <p class="text-muted">Are you sure you want to delete <strong>{{ category.name }}</strong>? This cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="ti ti-trash me-1"></i>Delete
                </button>
                <a href="{% url 'expensecategory_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
